# --- Preposition «به» written attached -------------------------------------------
- {wrong: بخاطر, right: به‌خاطر, note: The preposition به is written separately.}
- {wrong: بعنوان, right: به‌عنوان}
- {wrong: بطور, right: به‌طور}
- {wrong: بویژه, right: به‌ویژه}
