[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "paknevis"
dynamic = ["version"]
description = "Persian text linter and auto-fixer (پاک‌نویس): Prettier/ESLint for Persian writing — ZWNJ, Arabic characters, punctuation, digits; Markdown/HTML/LaTeX aware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mohammadreza Zare", email = "155621094+mrzroot@users.noreply.github.com" }]
keywords = [
  "persian", "farsi", "linter", "formatter", "zwnj", "typography", "nlp",
  "markdown", "latex", "xepersian", "pre-commit", "virastar", "پاک‌نویس",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: Persian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.16,<0.17",
  "mypy>=1.10",
  "types-PyYAML",
  "python-docx>=1.1",
  "build>=1.2",
]

[project.scripts]
paknevis = "paknevis.cli:main"

[project.urls]
Homepage = "https://mrzroot.github.io/paknevis/"
Repository = "https://github.com/mrzroot/paknevis"
Issues = "https://github.com/mrzroot/paknevis/issues"
Changelog = "https://github.com/mrzroot/paknevis/blob/main/CHANGELOG.md"
Playground = "https://mrzroot.github.io/paknevis/"

[tool.hatch.version]
path = "src/paknevis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paknevis"]

[tool.hatch.build.targets.sdist]
include = ["src/paknevis", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PIE", "RET", "N", "D2", "D3", "D4"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Persian text intentionally contains ambiguous-looking Unicode
  "D203", "D213", "D413",
  "D401",  # docstrings describe what helpers return
  "E501",  # long Persian prose strings; the formatter handles code layout
]

[tool.ruff.lint.isort]
known-first-party = ["paknevis"]
known-local-folder = ["helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802", "PT018"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/paknevis"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --doctest-modules --import-mode=importlib"
pythonpath = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.coverage.run]
branch = true
source = ["paknevis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "pragma: no cover"]
